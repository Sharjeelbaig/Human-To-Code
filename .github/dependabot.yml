version: 2
updates:
  # The package ships with only two runtime dependencies, so npm updates are
  # low-volume and worth reviewing individually rather than in a weekly batch.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      include: scope

  # Pinned action versions go stale silently and are a supply-chain surface.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
