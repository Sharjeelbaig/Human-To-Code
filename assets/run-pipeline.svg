<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 300" width="1280" height="300" role="img" aria-labelledby="runTitle runDesc">
  <title id="runTitle">What one run does, from discovery to write</title>
  <desc id="runDesc">Discovery and the receipt run with no provider requests at all. Your confirmation is the gate. Only after it does the run issue the shared contract and todo requests, generate one pass per target, validate, and write in a rollback-protected batch. Failing validation buys at most one repair per whole-file JavaScript or TypeScript unit before the connected group is rejected.</desc>

  <defs>
    <linearGradient id="runSurface" x1="0" y1="0" x2="1280" y2="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#171015"/>
      <stop offset=".52" stop-color="#0d0d11"/>
      <stop offset="1" stop-color="#2a0d10"/>
    </linearGradient>
    <style>
      .sans { font-family: Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif; }
      .nm   { font-size: 19px; font-weight: 600; fill: #f7f4ef; }
      .sub  { font-size: 13.5px; fill: #8b8792; }
      .band { font-size: 13px; font-weight: 700; letter-spacing: .16em; }
      .note { font-size: 15px; fill: #aaa6b0; }
    </style>
  </defs>

  <rect width="1280" height="300" rx="28" fill="url(#runSurface)"/>

  <!-- Region labels -->
  <text class="sans band" x="200" y="72" text-anchor="middle" fill="#8fd6a8">NO PROVIDER REQUESTS</text>
  <text class="sans band" x="904" y="72" text-anchor="middle" fill="#ff8a5c">PROVIDER REQUESTS</text>

  <!-- Before the gate -->
  <g>
    <rect x="36" y="96" width="152" height="76" rx="14" fill="#ffffff" fill-opacity=".04" stroke="#ffffff" stroke-opacity=".08"/>
    <text class="sans nm"  x="112" y="129" text-anchor="middle">Discover</text>
    <text class="sans sub" x="112" y="150" text-anchor="middle">.human + @human</text>

    <rect x="212" y="96" width="152" height="76" rx="14" fill="#ffffff" fill-opacity=".04" stroke="#ffffff" stroke-opacity=".08"/>
    <text class="sans nm"  x="288" y="129" text-anchor="middle">Receipt</text>
    <text class="sans sub" x="288" y="150" text-anchor="middle">what will run</text>
  </g>

  <!-- The gate -->
  <rect x="388" y="96" width="152" height="76" rx="14" fill="#ff5f3c" fill-opacity=".14" stroke="#ff5f3c" stroke-opacity=".6" stroke-width="1.5"/>
  <text class="sans nm"  x="464" y="129" text-anchor="middle" fill="#ff8a5c">Confirm</text>
  <text class="sans sub" x="464" y="150" text-anchor="middle" fill="#c9c5cf">you approve</text>

  <!-- After the gate -->
  <g>
    <rect x="564" y="96" width="152" height="76" rx="14" fill="#ffffff" fill-opacity=".04" stroke="#ffffff" stroke-opacity=".08"/>
    <text class="sans nm"  x="640" y="129" text-anchor="middle">Plan</text>
    <text class="sans sub" x="640" y="150" text-anchor="middle">contract + todos</text>

    <rect x="740" y="96" width="152" height="76" rx="14" fill="#ffffff" fill-opacity=".04" stroke="#ffffff" stroke-opacity=".08"/>
    <text class="sans nm"  x="816" y="129" text-anchor="middle">Generate</text>
    <text class="sans sub" x="816" y="150" text-anchor="middle">per target</text>

    <rect x="916" y="96" width="152" height="76" rx="14" fill="#ffffff" fill-opacity=".04" stroke="#ffffff" stroke-opacity=".08"/>
    <text class="sans nm"  x="992" y="129" text-anchor="middle">Validate</text>
    <text class="sans sub" x="992" y="150" text-anchor="middle">compiler checks</text>

    <rect x="1092" y="96" width="152" height="76" rx="14" fill="#ffffff" fill-opacity=".04" stroke="#ffffff" stroke-opacity=".08"/>
    <text class="sans nm"  x="1168" y="129" text-anchor="middle">Write</text>
    <text class="sans sub" x="1168" y="150" text-anchor="middle">rollback-safe</text>
  </g>

  <!-- Connectors -->
  <g fill="none" stroke="#ff5f3c" stroke-opacity=".7" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M192 127 l12 7 l-12 7"/>
    <path d="M368 127 l12 7 l-12 7"/>
    <path d="M544 127 l12 7 l-12 7"/>
    <path d="M720 127 l12 7 l-12 7"/>
    <path d="M896 127 l12 7 l-12 7"/>
    <path d="M1072 127 l12 7 l-12 7"/>
  </g>

  <!-- Bounded repair loop: Validate back to Generate -->
  <path d="M984 180 q-48 34 -120 34 q-72 0 -120 -34" fill="none" stroke="#ff8a5c" stroke-opacity=".5" stroke-width="2" stroke-dasharray="6 6"/>
  <path d="M751 187 l-7 -7 l14 -4" fill="none" stroke="#ff8a5c" stroke-opacity=".7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="sans sub" x="864" y="234" text-anchor="middle">one repair per whole-file JS/TS unit, then the connected group is rejected</text>

  <text class="sans note" x="640" y="272" text-anchor="middle">Nothing reaches a provider or your disk before you confirm. One failed target never takes down the run.</text>
</svg>
