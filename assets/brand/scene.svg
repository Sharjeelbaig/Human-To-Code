<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 645 700" width="645" height="700">
<style>@keyframes anim-spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}@keyframes anim-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}@keyframes anim-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-20px)}}@keyframes anim-shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-10px) rotate(-5deg)}75%{transform:translateX(10px) rotate(5deg)}}@keyframes anim-typewriter-reveal{0%{transform:scaleX(0)}100%{transform:scaleX(1)}}@keyframes anim-text-rise{0%{transform:translateY(18px) scale(.98);opacity:0;filter:blur(10px)}60%{opacity:1}100%{transform:translateY(0) scale(1);opacity:1;filter:blur(0)}}@keyframes anim-text-flicker{0%,18%,22%,25%,53%,57%,100%{opacity:1;filter:drop-shadow(0 0 6px currentColor)}20%,24%,55%{opacity:.28;filter:none}}@keyframes anim-text-tracking{0%{letter-spacing:.42em;opacity:0}45%{opacity:.65}100%{letter-spacing:0;opacity:1}}


/* custom_animations.css */

@keyframes pulse-expand {
  0% { transform: scale(1); opacity: 1; }
  60% { transform: scale(2.2); opacity: 0.6; }
  100% { transform: scale(3); opacity: 0; }
}

.pulse-expand {
  animation: pulse-expand 1.5s ease-out infinite;
}

@keyframes smooth-zoom {
  0% { transform: scale(1); }
  50% { transform: scale(1.4); }
  100% { transform: scale(1); }
}

.smooth-zoom {
  animation: smooth-zoom 3s ease-in-out infinite;
}

.coin {
  width: 80px;
  height: 80px;
  transform-style: preserve-3d;
  animation: coinFlip 1s linear infinite;
  will-change: transform;
  perspective: 800px;
}

@keyframes coinFlip {
  from {
    transform: rotateY(0deg);
  }
  to {
    transform: rotateY(360deg);
  }
}</style>
