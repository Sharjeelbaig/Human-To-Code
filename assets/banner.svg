<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-labelledby="bannerTitle bannerDesc">
  <title id="bannerTitle">human-to-code - reviewed intent, validated code</title>
  <desc id="bannerDesc">The human-to-code chevron mark and wordmark beside an editor showing an @human comment compiling into a TypeScript health-check function.</desc>

  <defs>
    <!-- Brand surface: Night, warmed on one corner and cooled on the other, per assets/brand/BRAND.md. -->
    <linearGradient id="surface" x1="60" y1="20" x2="1220" y2="390" gradientUnits="userSpaceOnUse">
      <stop stop-color="#171015"/>
      <stop offset=".52" stop-color="#0d0d11"/>
      <stop offset="1" stop-color="#2a0d10"/>
    </linearGradient>
    <radialGradient id="coralGlow" cx="0" cy="0" r="1" gradientTransform="translate(1010 60) rotate(132) scale(430 330)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ff5f3c" stop-opacity=".24"/>
      <stop offset="1" stop-color="#ff5f3c" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#fff" opacity=".055"/>
    </pattern>
    <style>
      .sans { font-family: Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    </style>
  </defs>

  <rect width="1280" height="400" rx="32" fill="url(#surface)"/>
  <rect width="1280" height="400" rx="32" fill="url(#coralGlow)"/>
  <rect x="26" y="26" width="1228" height="348" rx="24" fill="url(#dots)" stroke="#fff" stroke-opacity=".08"/>

  <!-- Primary mark: opposing chevrons joined by the coral prompt cursor. -->
  <g transform="translate(74 60) scale(.82)">
    <path d="M51 25 17 64l34 39" fill="none" stroke="#f7f4ef" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="m77 25 34 39-34 39" fill="none" stroke="#f7f4ef" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="58" y="45" width="12" height="38" rx="6" fill="#ff5f3c"/>
  </g>

  <text x="190" y="128" class="sans" font-size="52" font-weight="850" letter-spacing="-2.4" fill="#f7f4ef">human-to-code</text>

  <text x="78" y="212" class="sans" font-size="40" font-weight="780" letter-spacing="-1.3" fill="#f7f4ef">Reviewed intent.</text>
  <text x="78" y="262" class="sans" font-size="40" font-weight="780" letter-spacing="-1.3" fill="#ff8a5c">Validated code.</text>

  <text x="78" y="304" class="sans" font-size="18" fill="#aaa6b0">Turn .human files and @human markers into real code.</text>

  <!-- Install chip: the one command the README opens with. -->
  <g transform="translate(78 328)">
    <rect width="290" height="44" rx="22" fill="#f7f4ef" fill-opacity=".07" stroke="#fff" stroke-opacity=".12"/>
    <text x="22" y="29" class="mono" font-size="16" font-weight="700" fill="#ff8a5c">$</text>
    <text x="42" y="29" class="mono" font-size="16" font-weight="700" fill="#f7f4ef">npx human-to-code .</text>
  </g>

  <!-- Editor card: the marker on top, the generated code below it. -->
  <g transform="translate(660 58)">
    <rect width="546" height="284" rx="20" fill="#f7f4ef" fill-opacity=".06" stroke="#fff" stroke-opacity=".12"/>
    <circle cx="30" cy="32" r="5" fill="#ff5f3c" fill-opacity=".85"/>
    <circle cx="50" cy="32" r="5" fill="#ff8a5c" fill-opacity=".55"/>
    <circle cx="70" cy="32" r="5" fill="#f7f4ef" fill-opacity=".25"/>
    <text x="92" y="37" class="mono" font-size="14" fill="#aaa6b0">src/health.ts</text>
    <path d="M1 58h544" stroke="#fff" stroke-opacity=".10"/>

    <text x="28" y="98" class="mono" font-size="15.5" fill="#6f6b74">//</text>
    <text x="52" y="98" class="mono" font-size="15.5" font-weight="700" fill="#ff5f3c">@human</text>
    <text x="122" y="98" class="mono" font-size="15.5" fill="#c9c5cf">add a health check returning 200</text>

    <g transform="translate(28 122)">
      <path d="M6 4v22" stroke="#ff5f3c" stroke-width="2.5" stroke-linecap="round"/>
      <path d="m-1 20 7 7 7-7" fill="none" stroke="#ff5f3c" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="30" y="24" class="mono" font-size="13" font-weight="700" fill="#aaa6b0">compile</text>
    </g>

    <text x="28" y="204" class="mono" font-size="15.5" fill="#ff8a5c">export function <tspan fill="#f7f4ef">health</tspan>() {</text>
    <text x="47" y="230" class="mono" font-size="15.5" fill="#ff8a5c">return <tspan fill="#f7f4ef">{ status: </tspan><tspan fill="#ff5f3c">200</tspan><tspan fill="#f7f4ef"> };</tspan></text>
    <text x="28" y="256" class="mono" font-size="15.5" fill="#f7f4ef">}</text>
  </g>
</svg>
